<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, interactive-widget=resizes-content"
    />
    <title>Advanced To-Do List</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
  </head>
  <body>
    <div class="container">
      <header>
        <div class="header-top">
          <h1>My Tasks</h1>
          <div class="filter-buttons">
            <button id="filter-all" class="active">All</button>
            <button id="filter-active">Active</button>
            <button id="filter-completed">Completed</button>
          </div>
        </div>

        <div class="header-actions">
          <button id="sort-btn">
            <i class="fas fa-sort-amount-down"></i> Sort by Date
          </button>
          <button id="clear-btn">
            <i class="fas fa-trash-alt"></i> Clear Completed
          </button>
        </div>
      </header>

      <div class="input-group">
        <input
          type="text"
          id="task-input"
          placeholder="What needs to be done?"
        />

        <input type="date" id="date-input" />

        <select id="priority-input">
          <option value="low">Low Priority</option>
          <option value="medium">Medium Priority</option>
          <option value="high">High Priority</option>
        </select>

        <button id="add-btn"><i class="fas fa-plus"></i> Add</button>
      </div>

      <ul id="todo-list"></ul>
      <div id="empty-state" class="empty-state">
        <i class="fas fa-clipboard-check"></i>
        <p>All caught up! No tasks.</p>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
